<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101113">
  <title>CHRYSION — European Roulette</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="monogram" aria-hidden="true">C</div>
        <div>
          <h1>CHRYSION <span>ROYALE</span></h1>
          <p>EUROPEAN ROULETTE</p>
        </div>
      </div>

      <div class="wallet">
        <span class="eyebrow">AVAILABLE</span>
        <strong id="balance">1,000</strong>
        <span class="unit">VIRTUAL CHIPS</span>
      </div>
    </header>

    <main class="layout">
      <section class="panel wheel-panel" aria-label="Roulette wheel">
        <div class="section-heading">
          <span class="eyebrow">PRIVATE TABLE</span>
          <span id="status" class="status">BETS OPEN</span>
        </div>

        <div class="wheel-space">
          <svg id="wheel" viewBox="0 0 600 600"
               role="img" aria-label="European roulette wheel"></svg>
        </div>

        <div class="result-box">
          <span id="result-number" class="result-number">—</span>
          <div>
            <span class="eyebrow">TABLE RESULT</span>
            <p id="result" role="status" aria-live="polite">
              Place your bets
            </p>
          </div>
        </div>

        <div class="history-section">
          <span class="eyebrow">LAST RESULTS</span>
          <div id="history" class="history"></div>
        </div>
      </section>

      <section class="panel betting-panel" aria-label="Betting table">
        <div class="section-heading">
          <h2>Place your chips</h2>
          <span class="eyebrow">SINGLE ZERO</span>
        </div>

        <div id="chips" class="chips" aria-label="Chip value"></div>

        <div class="table-scroll">
          <div id="table" class="table"
               aria-label="Betting layout"></div>
        </div>

        <div class="bet-summary">
          <div>
            <span class="eyebrow">TOTAL BET</span>
            <strong id="total">0</strong>
          </div>
          <div class="summary-right">
            <span class="eyebrow">LAST NET</span>
            <strong id="net">—</strong>
          </div>
        </div>

        <div class="tools">
          <button id="undo" type="button">Undo</button>
          <button id="double" type="button">×2</button>
          <button id="clear" type="button">Clear</button>
          <button id="rebet" type="button">Rebet</button>
        </div>

        <button id="spin" class="spin" type="button">SPIN</button>

        <p id="hint" class="hint" role="status">
          Select a chip. Click a bet.
        </p>

        <footer>FOR FUN ONLY · NO REAL MONEY</footer>
      </section>
    </main>
  </div>
</body>
</html>
