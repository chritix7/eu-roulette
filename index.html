<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AURUM ROULETTE — European Roulette</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="glow"></div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">A</div>
      <div>
        <h1>AURUM ROULETTE</h1>
        <p>European Roulette · Private Table</p>
      </div>
    </div>

    <div class="wallet">
      <span>Balance</span>
      <strong><span id="balance">1,000</span> <small>CHIPS</small></strong>
    </div>
  </header>

  <main class="layout">
    <section class="wheel-panel">
      <div class="wheel-stage">
        <div class="wheel-frame">
          <svg id="wheel" viewBox="0 0 500 500"></svg>
          <div id="ball" class="ball"></div>
          <div class="hub"><span>AURUM</span></div>
        </div>
        <div class="pointer"></div>
      </div>

      <div id="result" class="result">
        Placez vos jetons sur le tapis pour lancer la roulette
      </div>

      <div class="history">
        <span class="history-title">Derniers numéros</span>
        <div id="history-list" class="history-list"></div>
      </div>
    </section>

    <section class="bet-panel">
      <div class="panel-head">
        <h2>Table de mise</h2>
        <div class="chip-selector">
          <button class="chip-btn active" data-chip="10">10</button>
          <button class="chip-btn" data-chip="25">25</button>
          <button class="chip-btn" data-chip="50">50</button>
          <button class="chip-btn" data-chip="100">100</button>
        </div>
      </div>

      <div class="roulette-table">
        <button class="table-cell zero" data-bet="number" data-number="0">0</button>

        <div class="numbers-grid" id="numbers-grid"></div>

        <div class="column-bets">
          <button class="table-cell wide" data-bet="column" data-column="3">2:1</button>
          <button class="table-cell wide" data-bet="column" data-column="2">2:1</button>
          <button class="table-cell wide" data-bet="column" data-column="1">2:1</button>
        </div>

        <div class="dozen-bets">
          <button class="table-cell wide" data-bet="dozen" data-dozen="1">1st 12</button>
          <button class="table-cell wide" data-bet="dozen" data-dozen="2">2nd 12</button>
          <button class="table-cell wide" data-bet="dozen" data-dozen="3">3rd 12</button>
        </div>

        <div class="outside-bets">
          <button class="table-cell" data-bet="low">1–18</button>
          <button class="table-cell" data-bet="even">Pair</button>
          <button class="table-cell red" data-bet="red">Rouge</button>
          <button class="table-cell black" data-bet="black">Noir</button>
          <button class="table-cell" data-bet="odd">Impair</button>
          <button class="table-cell" data-bet="high">19–36</button>
        </div>
      </div>

      <div class="active-bet" id="active-bet">
        Aucune mise placée
      </div>

      <button id="spin" class="primary">Lancer la roulette</button>
      <button id="reset" class="ghost">Réinitialiser la table</button>

      <p class="disclaimer">
        Jeu de démonstration · Jetons virtuels uniquement · Aucun argent réel
      </p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
